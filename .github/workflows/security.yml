name: security-pipeline

# Runs on every push and pull request. Any finding fails the build, so a PR
# that reintroduces a seeded flaw cannot be merged.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Gitleaks (committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    name: Semgrep (insecure code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep==1.180.0
      - run: semgrep --metrics=off --error --config .semgrep/rules.yaml --config "p/python" app/

  false_positive_check:
    name: Semgrep rules stay quiet on fixed code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install semgrep==1.180.0
      - run: semgrep --metrics=off --error --config .semgrep/rules.yaml fixed/

  deps_and_container:
    name: Trivy (dependencies and container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned Trivy release binary instead of trivy-action: the old action
      # tag was removed upstream, which broke the job at setup.
      - name: Install Trivy 0.69.3
        run: |
          curl -sSfL -o trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz
          tar xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/
      - name: Scan dependencies and Dockerfile
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  iac:
    name: Checkov (infrastructure as code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
          soft_fail: false
