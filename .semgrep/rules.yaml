rules:
  - id: sqli-fstring-execute
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built from an f-string and passed to execute(). User input
      concatenated into SQL allows SQL injection (CWE-89). Use parameterised
      queries: conn.execute("... WHERE x=?", (value,)).
    metadata: {cwe: "CWE-89", owasp: "A03:2021"}
    patterns:
      - pattern-regex: 'f"\s*(SELECT|INSERT|UPDATE|DELETE)[^"]*\{'


  - id: hardcoded-secret
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded secret in source (CWE-798). Load signing keys and passwords
      from a secret manager or environment, never hardcode them.
    metadata: {cwe: "CWE-798"}
    patterns:
      # Value must be a plain literal: a "{" means an f-string placeholder
      # (e.g. password='{body.password}' in SQL), which is not a secret.
      - pattern-regex: '(?i)\b[a-z0-9_]*(secret|signing_?key|password)[a-z0-9_]*\s*=\s*["''][^"''{]{8,}["'']'

  - id: cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    message: >-
      CORS allows any origin together with credentials (CWE-942). A wildcard
      origin must not be combined with allow_credentials=True.
    metadata: {cwe: "CWE-942"}
    patterns:
      - pattern-regex: 'allow_origins\s*=\s*\[\s*"\*"\s*\]'


  - id: debug-endpoint-leaks-env
    languages: [python]
    severity: ERROR
    message: >-
      Endpoint returns os.environ, leaking configuration and secrets
      (CWE-215). Remove debug endpoints before shipping.
    metadata: {cwe: "CWE-215"}
    patterns:
      - pattern: dict(os.environ)

  - id: plaintext-password-insert
    languages: [python]
    severity: WARNING
    message: >-
      Password appears to be stored without hashing (CWE-256). Store a salted
      hash (e.g. bcrypt/argon2), never the raw password.
    metadata: {cwe: "CWE-256"}
    patterns:
      # Skip inserts that store a hash and salt (the safe pattern).
      - pattern-regex: "INSERT INTO users(?!.*(hash|salt)).*(pw|password)"

  - id: pii-in-log
    languages: [python]
    severity: ERROR
    message: >-
      Personal data or credentials interpolated into a log line (CWE-532).
      Logs are copied widely and kept for a long time, so this breaks GDPR
      Art. 5(1)(c) data minimisation and Art. 32 security. Log an ID or a
      masked value instead.
    metadata: {cwe: "CWE-532", gdpr: "Art. 5(1)(c), Art. 32"}
    patterns:
      - pattern-regex: 'log(ger)?\.(debug|info|warning|error|exception)\(\s*f["''][^"'']*\{[^}]*(password|passwd|email|phone|token|dob|address)'
